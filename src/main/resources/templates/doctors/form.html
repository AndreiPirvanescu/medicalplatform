<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${doctor.id == null ? 'Add Doctor' : 'Edit Doctor'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <div>
            <h1 th:text="${doctor.id == null ? 'Add Doctor' : 'Edit Doctor'}">Add Doctor</h1>
            <p class="subtitle" th:if="${medicalUnit != null}">
                For <strong th:text="${medicalUnit.name}">Unit name</strong>
            </p>
        </div>
        <a class="btn btn-secondary"
           th:href="${medicalUnit != null} ? @{/medical-units/{id}(id=${medicalUnit.id})} : @{/doctors}">&larr; Back</a>
    </div>

    <div class="card">
        <!--
          "doctor" model attribute is a DoctorFormDto: medicalUnitId, userId,
          licenseNumber, specializations (List<Specialization>).

          Create: GET  /doctors/new(?medicalUnitId=)  -> submits to
                  POST /doctors (DoctorController, calls the same
                  doctorService.create used by the JSON API's
                  POST /api/medicalUnits/{id}/doctors, unit now picked on the
                  form itself instead of coming from the URL)
          Edit:   GET  /doctors/{id}/edit -> submits to
                  POST /doctors/{id}/update (DoctorController, calls the same
                  doctorService.update used by PUT /api/doctors/{id})
        -->
        <form th:action="${doctor.id == null} ? @{/doctors} : @{/doctors/{id}/update(id=${doctor.id})}"
              th:object="${doctor}" method="post">

            <div class="form-grid">
                <!-- Create: which medical unit this doctor belongs to - not changeable afterwards. -->
                <div class="form-group" th:if="${doctor.id == null}">
                    <label for="medicalUnitId">Medical Unit <span class="required">*</span></label>
                    <select id="medicalUnitId" th:field="*{medicalUnitId}"
                            th:classappend="${#fields.hasErrors('medicalUnitId')} ? 'is-invalid'">
                        <option value="">-- Select a medical unit --</option>
                        <option th:each="unit : ${allMedicalUnits}" th:value="${unit.id}" th:text="${unit.name}">Unit</option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('medicalUnitId')}" th:errors="*{medicalUnitId}"></div>
                </div>
                <input type="hidden" th:if="${doctor.id != null}" th:field="*{medicalUnitId}"/>

                <div class="form-group">
                    <label for="userId">User <span class="required">*</span></label>

                    <!-- Create: pick from "eligibleUsers" (UserService.findEligibleDoctorUsers() - users with no role assigned yet). -->
                    <th:block th:if="${doctor.id == null}">
                        <select id="userId" th:field="*{userId}"
                                th:classappend="${#fields.hasErrors('userId')} ? 'is-invalid'">
                            <option value="">-- Select a user --</option>
                            <option th:each="u : ${eligibleUsers}" th:value="${u.id}"
                                    th:text="${u.fullName} + ' (' + ${u.email} + ')'">User</option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
                        <div th:if="${#lists.isEmpty(eligibleUsers)}" class="text-muted" style="margin-top:6px; font-size:0.85rem;">
                            No users without a role are available right now - free one up, or create a new user account, to register a doctor.
                        </div>
                    </th:block>

                    <!-- Edit: the linked user account can't be changed - shown read-only, userId still travels via a hidden field (and is re-pinned server-side in DoctorController regardless). -->
                    <th:block th:if="${doctor.id != null}">
                        <input type="hidden" th:field="*{userId}"/>
                        <div class="readonly-box" th:if="${currentUser != null}">
                            <strong th:text="${currentUser.fullName}">Name</strong>
                            &middot; <span th:text="${currentUser.email}">email</span>
                            &middot; <span th:text="${currentUser.phone}">phone</span>
                        </div>
                        <div class="text-muted" style="margin-top:6px; font-size:0.85rem;">
                            The linked user account can't be changed after the doctor profile is created.
                        </div>
                    </th:block>
                </div>

                <div class="form-group">
                    <label for="licenseNumber">License Number <span class="required">*</span></label>
                    <input type="text" id="licenseNumber" th:field="*{licenseNumber}"
                           th:classappend="${#fields.hasErrors('licenseNumber')} ? 'is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('licenseNumber')}" th:errors="*{licenseNumber}"></div>
                </div>

                <div class="form-group full-width">
                    <label>Specializations <span class="required">*</span></label>
                    <div class="checkbox-grid">
                        <div class="checkbox-item" th:each="spec : ${allSpecializations}">
                            <input type="checkbox" th:id="${'spec-' + spec}" name="specializations"
                                   th:value="${spec}"
                                   th:checked="${doctor.specializations != null and doctor.specializations.contains(spec)}"/>
                            <label th:for="${'spec-' + spec}" th:text="${spec}" style="font-weight:400;">SPEC</label>
                        </div>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('specializations')}" th:errors="*{specializations}"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${doctor.id == null ? 'Add Doctor' : 'Save Changes'}">Save</button>
                <a class="btn btn-secondary"
                   th:href="${medicalUnit != null} ? @{/medical-units/{id}(id=${medicalUnit.id})} : @{/doctors}">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
