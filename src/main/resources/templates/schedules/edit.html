<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit Time Slot')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <h1>Edit Time Slot</h1>
        <a class="btn btn-secondary" th:href="@{/doctors/{id}/schedule(id=${slot.doctorId})}">&larr; Back to schedule</a>
    </div>

    <div class="card">
        <p class="text-muted" th:text="${slot.doctorFullName}">Doctor name</p>

        <form th:action="@{/schedules/{id}/update(id=${slot.id})}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="startTime">Start <span class="required">*</span></label>
                    <input type="datetime-local" id="startTime" name="startTime" th:value="${slot.startTime}" required/>
                </div>
                <div class="form-group">
                    <label for="endTime">End <span class="required">*</span></label>
                    <input type="datetime-local" id="endTime" name="endTime" th:value="${slot.endTime}" required/>
                </div>
                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="available" name="available" value="true" th:checked="${slot.available}"/>
                        <label for="available" style="font-weight:400;">Available for booking</label>
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a class="btn btn-secondary" th:href="@{/doctors/{id}/schedule(id=${slot.doctorId})}">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
