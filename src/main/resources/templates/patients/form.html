<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${patient.id == null ? 'Register Patient' : 'Edit Patient'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <h1 th:text="${patient.id == null ? 'Register Patient' : 'Edit Patient'}">Register Patient</h1>
        <a class="btn btn-secondary" th:href="@{/patients}">&larr; Back to list</a>
    </div>

    <div class="card">
        <!--
          "patient" model attribute is a PatientRequestDto: userId, dateOfBirth, bloodType.
        -->
        <form th:action="${patient.id == null} ? @{/patients} : @{/patients/{id}/update(id=${patient.id})}"
              th:object="${patient}" method="post">

            <div class="form-grid">
                <div class="form-group">
                    <label for="userId">User <span class="required">*</span></label>

                    <!-- Create: pick from "eligibleUsers" (UserService.findEligiblePatientUsers() - users with no role assigned yet). -->
                    <th:block th:if="${patient.id == null}">
                        <select id="userId" th:field="*{userId}"
                                th:classappend="${#fields.hasErrors('userId')} ? 'is-invalid'">
                            <option value="">-- Select a user --</option>
                            <option th:each="u : ${eligibleUsers}" th:value="${u.id}"
                                    th:text="${u.fullName} + ' (' + ${u.email} + ')'">User</option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
                        <div th:if="${#lists.isEmpty(eligibleUsers)}" class="text-muted" style="margin-top:6px; font-size:0.85rem;">
                            No users without a role are available right now - free one up, or create a new user account, to register a patient.
                        </div>
                    </th:block>

                    <!-- Edit: the linked user account can't be changed - shown read-only, userId still travels via a hidden field (and is re-pinned server-side in PatientController regardless). -->
                    <th:block th:if="${patient.id != null}">
                        <input type="hidden" th:field="*{userId}"/>
                        <div class="readonly-box" th:if="${currentUser != null}">
                            <strong th:text="${currentUser.fullName}">Name</strong>
                            &middot; <span th:text="${currentUser.email}">email</span>
                            &middot; <span th:text="${currentUser.phone}">phone</span>
                        </div>
                        <div class="text-muted" style="margin-top:6px; font-size:0.85rem;">
                            The linked user account can't be changed after the patient profile is created.
                        </div>
                    </th:block>
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth <span class="required">*</span></label>
                    <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}"
                           th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                </div>

                <div class="form-group">
                    <label for="bloodType">Blood Type <span class="required">*</span></label>
                    <select id="bloodType" th:field="*{bloodType}"
                            th:classappend="${#fields.hasErrors('bloodType')} ? 'is-invalid'">
                        <option value="">-- Select --</option>
                        <option th:each="bt : ${'A+,A-,B+,B-,AB+,AB-,O+,O-'.split(',')}" th:value="${bt}" th:text="${bt}">O+</option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('bloodType')}" th:errors="*{bloodType}"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${patient.id == null ? 'Register Patient' : 'Save Changes'}">Save</button>
                <a class="btn btn-secondary" th:href="@{/patients}">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
