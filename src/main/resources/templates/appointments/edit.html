<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit Appointment')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <h1>Edit Appointment</h1>
        <a class="btn btn-secondary" th:href="@{/appointments/{id}(id=${appointment.id})}">&larr; Back to appointment</a>
    </div>

    <div class="card">
        <div class="detail-grid" style="margin-bottom:20px;">
            <div class="detail-item">
                <div class="detail-label">Patient</div>
                <div class="detail-value" th:text="${appointment.patientFullName}">Patient</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Doctor</div>
                <div class="detail-value" th:text="${appointment.doctorFullName}">Doctor</div>
            </div>
        </div>

        <form th:action="@{/appointments/{id}/update(id=${appointment.id})}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="appointmentDateTime">Date &amp; Time <span class="required">*</span></label>
                    <input type="datetime-local" id="appointmentDateTime" name="appointmentDateTime"
                           th:value="${appointment.appointmentDateTime}" required/>
                </div>
                <div class="form-group">
                    <label for="status">Status <span class="required">*</span></label>
                    <select id="status" name="status" required>
                        <option th:each="s : ${allStatuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == appointment.status}">STATUS</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a class="btn btn-secondary" th:href="@{/appointments/{id}(id=${appointment.id})}">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
