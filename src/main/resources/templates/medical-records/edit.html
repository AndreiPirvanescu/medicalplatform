<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit Medical Record')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <h1 th:text="'Edit Medical Record - ' + ${patient.firstName} + ' ' + ${patient.lastName}">Edit Medical Record</h1>
        <a class="btn btn-secondary" th:href="@{/patients/{id}/medical-record(id=${patient.id})}">&larr; Back to record</a>
    </div>

    <div class="card">
        <!-- Mirrors PUT /api/medical-records/{id} -->
        <form th:action="@{/medical-records/{id}/update(id=${record.id})}" method="post">
            <input type="hidden" name="patientId" th:value="${patient.id}"/>
            <div class="form-group full-width">
                <label for="notes">Notes <span class="required">*</span></label>
                <textarea id="notes" name="notes" rows="8" style="width:100%;" required th:text="${record.notes}"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a class="btn btn-secondary" th:href="@{/patients/{id}/medical-record(id=${patient.id})}">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
