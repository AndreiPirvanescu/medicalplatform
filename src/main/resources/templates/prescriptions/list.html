<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Prescriptions')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Prescriptions</h1>
            <p class="subtitle">All prescriptions issued across the platform.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/prescriptions/new}">+ Issue Prescription</a>
    </div>

    <div class="filter-bar">
        <form th:action="@{/prescriptions}" method="get">
            <div class="field">
                <label for="patientId">Patient</label>
                <select id="patientId" name="patientId">
                    <option value="">Any</option>
                    <option th:each="p : ${allPatients}" th:value="${p.id}"
                            th:text="${p.firstName + ' ' + p.lastName}"
                            th:selected="${param.patientId != null and param.patientId[0] == p.id.toString()}">Patient</option>
                </select>
            </div>
            <div class="field">
                <label for="doctorId">Doctor</label>
                <select id="doctorId" name="doctorId">
                    <option value="">Any</option>
                    <option th:each="d : ${allDoctors}" th:value="${d.id}" th:text="${d.doctorFullName}"
                            th:selected="${param.doctorId != null and param.doctorId[0] == d.id.toString()}">Doctor</option>
                </select>
            </div>
            <div class="field">
                <label for="from">From</label>
                <input type="datetime-local" id="from" name="from" th:value="${param.from}"/>
            </div>
            <div class="field">
                <label for="to">To</label>
                <input type="datetime-local" id="to" name="to" th:value="${param.to}"/>
            </div>
            <div class="field">
                <button type="submit" class="btn btn-secondary">Filter</button>
            </div>
            <div class="field">
                <a th:href="@{/prescriptions}" class="btn btn-secondary">Clear</a>
            </div>
        </form>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Issued</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Medications</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="rx : ${prescriptions.content}">
                <td th:text="${#temporals.format(rx.issueDate, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 10:00</td>
                <td><a th:href="@{/patients/{id}(id=${rx.patientId})}" th:text="${rx.patientFullName}">Patient</a></td>
                <td><a th:href="@{/doctors/{id}(id=${rx.doctorId})}" th:text="${rx.doctorFullName}">Doctor</a></td>
                <td>
                    <div class="badge-list">
                        <span class="badge" th:each="med : ${rx.medications}" th:text="${med.name}">Medication</span>
                        <span th:if="${rx.medications.isEmpty()}" class="text-muted">None</span>
                    </div>
                </td>
                <td class="actions-cell">
                    <div class="btn-group">
                        <a class="btn btn-secondary btn-sm" th:href="@{/prescriptions/{id}(id=${rx.id})}">View</a>
                        <a class="btn btn-secondary btn-sm" th:href="@{/prescriptions/{id}/edit(id=${rx.id})}">Edit</a>
                        <form th:action="@{/prescriptions/{id}/delete(id=${rx.id})}" method="post"
                              onsubmit="return confirm('Delete this prescription?');">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${prescriptions.content.isEmpty()}">
                <td colspan="5" class="empty-state">No prescriptions match your filters.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav class="pagination" th:if="${prescriptions.totalPages > 1}">
        <a th:if="${!prescriptions.first}" th:href="@{/prescriptions(page=${prescriptions.number - 1})}">&laquo; Prev</a>
        <span th:each="i : ${#numbers.sequence(0, prescriptions.totalPages - 1)}">
            <span th:if="${i == prescriptions.number}" class="current" th:text="${i + 1}">1</span>
            <a th:unless="${i == prescriptions.number}" th:href="@{/prescriptions(page=${i})}" th:text="${i + 1}">1</a>
        </span>
        <a th:if="${!prescriptions.last}" th:href="@{/prescriptions(page=${prescriptions.number + 1})}">Next &raquo;</a>
    </nav>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
