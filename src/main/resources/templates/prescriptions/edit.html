<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Edit Prescription')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <h1>Edit Prescription</h1>
        <a class="btn btn-secondary" th:href="@{/prescriptions/{id}(id=${prescription.id})}">&larr; Back to prescription</a>
    </div>

    <div class="card">
        <div class="detail-grid" style="margin-bottom:20px;">
            <div class="detail-item">
                <div class="detail-label">Patient</div>
                <div class="detail-value" th:text="${prescription.patientFullName}">Patient</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Doctor</div>
                <div class="detail-value" th:text="${prescription.doctorFullName}">Doctor</div>
            </div>
        </div>

        <form th:action="@{/prescriptions/{id}/update(id=${prescription.id})}" method="post">
            <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="4" style="width:100%;" th:text="${prescription.notes}"></textarea>
            </div>

            <div class="form-group full-width">
                <label>Medications <span class="required">*</span></label>
                <div class="checkbox-grid">
                    <div class="checkbox-item" th:each="med : ${allMedications}">
                        <input type="checkbox" th:id="${'med-' + med.id}" name="medicationIds" th:value="${med.id}"
                               th:checked="${selectedMedicationIds.contains(med.id)}"/>
                        <label th:for="${'med-' + med.id}" style="font-weight:400;" th:text="${med.name} + ' (' + ${med.dosage} + ')'">Medication</label>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a class="btn btn-secondary" th:href="@{/prescriptions/{id}(id=${prescription.id})}">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
