<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${medicalUnit.id == null ? 'Add Medical Unit' : 'Edit Medical Unit'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">

    <div class="page-header">
        <div>
            <h1 th:text="${medicalUnit.id == null ? 'Add Medical Unit' : 'Edit Medical Unit'}">Add Medical Unit</h1>
        </div>
        <a class="btn btn-secondary" th:href="@{/medical-units}">&larr; Back to list</a>
    </div>

    <div class="card">
        <form th:action="${medicalUnit.id == null} ? @{/medical-units} : @{/medical-units/{id}/update(id=${medicalUnit.id})}"
              th:object="${medicalUnit}" method="post">

            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" id="name" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone <span class="required">*</span></label>
                    <input type="tel" id="phone" th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="form-group full-width">
                    <label for="address">Address <span class="required">*</span></label>
                    <input type="text" id="address" th:field="*{address}"
                           th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"/>
                    <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="form-group">
                    <label for="managerId">Manager</label>
                    <select id="managerId" th:field="*{managerId}">
                        <option value="">-- Unassigned --</option>
                        <option th:each="m : ${managers}" th:value="${m.id}"
                                th:text="${m.fullName} + ' (' + ${m.email} + ')'">Manager name</option>
                    </select>
                    <div th:if="${#lists.isEmpty(managers)}" class="text-muted" style="margin-top:6px; font-size:0.85rem;">
                        No users without a role are available right now - free one up, or create a new user account, to assign a manager.
                    </div>
                    <div th:if="${currentManager != null}" class="text-muted" style="margin-top:6px; font-size:0.85rem;">
                        Currently assigned: <strong th:text="${currentManager.fullName}">Name</strong>
                        &middot; <span th:text="${currentManager.email}">email</span>
                        &middot; <span th:text="${currentManager.phone}">phone</span>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${medicalUnit.id == null ? 'Create Medical Unit' : 'Save Changes'}">Save</button>
                <a class="btn btn-secondary" th:href="@{/medical-units}">Cancel</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
